<!doctype html>
<html lang="zh-CN"><head><script src="/assets/i18n.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title data-i18n="登录项目工作台">登录项目工作台</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#101723;color:#edf2fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(100%,420px);background:#182333;border:1px solid #344257;border-radius:20px;padding:32px;box-shadow:0 20px 70px #0004}h1{font-size:26px;margin:0 0 12px}p{color:#b9c5d7;line-height:1.6}label{display:block;margin:24px 0 8px}select{font:inherit;padding:8px;background:#101723;color:inherit;border:1px solid #53627a;border-radius:8px}.language-control{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin:0 0 18px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}input,button{font:inherit;width:100%;padding:13px;border-radius:10px}input{background:#101723;color:inherit;border:1px solid #53627a}button{margin-top:18px;background:#9cc4ff;border:0;color:#11213b;font-weight:600;cursor:pointer}button:disabled{opacity:.6}#error{color:#ffadb8}a{color:#9cc4ff}[hidden]{display:none!important}</style></head>
<body><main><label class="language-control"><span class="sr-only">Language / 语言</span><select id="language-select" data-language-select aria-label="Language / 语言"><option value="auto" data-i18n="跟随系统">跟随系统</option><option value="en">English</option><option value="zh-CN">简体中文</option></select></label><h1><span data-i18n="项目工作台">项目工作台</span></h1><p id="intro"><span data-i18n="输入本机设置的密码，进入工作台。">输入本机设置的密码，进入工作台。</span></p><form id="login"><label for="password"><span data-i18n="访问密码">访问密码</span></label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit"><span data-i18n="登录">登录</span></button></form><p id="error" role="alert" hidden></p><a id="return-login" href="/login" hidden><span data-i18n="使用密码登录">使用密码登录</span></a></main>
<script>
'use strict';
const {t:tr,ui,message}=globalThis.PMI18n;
const form=document.getElementById('login'),error=document.getElementById('error'),button=document.getElementById('submit');
async function authenticate(endpoint,input){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)}),data=await response.json();if(!response.ok)throw new Error(message(data.error)||tr('暂时无法登录'));location.replace(globalThis.PMI18n.href('/'));}
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;error.hidden=true;try{await authenticate('/auth/login',{password:document.getElementById('password').value});}catch(e){error.textContent=message(e.message);error.hidden=false;}finally{button.disabled=false;}};
if(location.pathname==='/share'){
 const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'','/share');form.hidden=true;document.getElementById('intro').textContent=tr('正在验证分享链接…');
 authenticate('/auth/share',{token}).catch(e=>{document.getElementById('intro').textContent=tr('无法打开分享');error.textContent=message(e.message);error.hidden=false;document.getElementById('return-login').hidden=false;});
}
</script></body></html>
