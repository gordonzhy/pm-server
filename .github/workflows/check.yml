name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26-intel
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
  publish-next:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'gordonzhy/pm-server'
    runs-on: ubuntu-latest
    environment: npm-next
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-pm-server-next
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node scripts/release-next.mjs prepare
      - run: node scripts/release-next.mjs publish
      - name: Release receipt
        if: success()
        run: cat .release/candidate.json .release/result.json >> "$GITHUB_STEP_SUMMARY"
